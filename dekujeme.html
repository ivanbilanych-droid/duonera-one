<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>První krok je hotový — DUONERA</title>
  <link rel="stylesheet" href="styles.css?v=5">
  <style>
    *{box-sizing:border-box}body.thank-you-page{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;color:#172326;background:linear-gradient(145deg,#f7f4ee,#eeebe5 62%,#e4ece9);font-family:Arial,Helvetica,sans-serif}.thank-you-card{width:min(700px,100%);padding:58px 46px;border:1px solid rgba(255,255,255,.75);border-radius:32px;background:rgba(251,249,245,.9);text-align:center;box-shadow:0 22px 60px rgba(23,35,38,.11)}.thank-you-logo{margin-bottom:6px;font:19px Georgia,serif;letter-spacing:.18em}.thank-you-logo:first-letter{color:#bf7452}.thank-you-sub{margin-bottom:37px;color:#66736f;font-size:8px;letter-spacing:.22em}.thank-you-symbol{width:68px;height:68px;margin:0 auto 23px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#6f918a;font-size:27px}.thank-you-card h1{margin:0 0 17px;font:400 clamp(38px,6vw,58px)/1.04 Georgia,serif;letter-spacing:-.03em}.thank-you-card p{max-width:560px;margin:0 auto 27px;color:#66736f;font-size:16px;line-height:1.6}.thank-you-note{margin-top:22px!important;padding-top:20px;border-top:1px solid rgba(23,35,38,.15);font-size:12px!important}.thank-you-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.thank-you-button{min-height:52px;padding:0 25px;border-radius:26px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800}.thank-you-button.primary{border:0;color:#fff;background:#bf7452;box-shadow:0 12px 27px rgba(191,116,82,.2)}.thank-you-button.secondary{border:1px solid rgba(23,35,38,.17);color:#172326;background:transparent}@media(max-width:600px){body.thank-you-page{padding:14px}.thank-you-card{padding:42px 20px;border-radius:28px}.thank-you-card p{font-size:14px}.thank-you-actions{display:grid}.thank-you-button{width:100%}}
  </style>
</head>
<body class="thank-you-page">
  <main class="thank-you-card">
    <div class="thank-you-logo">♛ DUONERA</div>
    <div class="thank-you-sub">PRIVATE DATING CONCIERGE</div>
    <div class="thank-you-symbol">✓</div>
    <h1>Potvrďte svůj e-mail.</h1>
    <p>Otevřete potvrzovací e-mail od DUONERA a klikněte na odkaz. Potom se otevře váš soukromý účet.</p>
    <div class="thank-you-actions"><a class="thank-you-button primary" href="ucet.html">Otevřít osobní účet</a><a class="thank-you-button secondary" href="index.html">Zpět na hlavní stránku</a></div>
    <p class="thank-you-note">Nepřišel e-mail? Zkontrolujte složku Spam. Potom se můžete přihlásit e-mailem a heslem.</p>
  </main>
<script>
  const copy={
    cs:{title:'Potvrďte svůj e-mail.',text:'Otevřete potvrzovací e-mail od DUONERA a klikněte na odkaz. Potom se otevře váš soukromý účet.',primary:'Otevřít přihlášení',secondary:'Zpět na hlavní stránku',note:'Nepřišel e-mail? Zkontrolujte složku Spam. Potom se můžete přihlásit e-mailem a heslem.'},
    en:{title:'Confirm your email.',text:'Open the DUONERA confirmation email and click the link. Your private account will then open.',primary:'Open sign in',secondary:'Back to home',note:'No email? Check your Spam folder. You can then sign in with your email and password.'},
    de:{title:'Bestätigen Sie Ihre E-Mail.',text:'Öffnen Sie die Bestätigungs-E-Mail von DUONERA und klicken Sie auf den Link. Danach öffnet sich Ihr privates Konto.',primary:'Zur Anmeldung',secondary:'Zur Startseite',note:'Keine E-Mail? Prüfen Sie den Spam-Ordner. Danach melden Sie sich mit E-Mail und Passwort an.'},
    it:{title:'Conferma la tua e-mail.',text:'Apri l’e-mail di conferma di DUONERA e fai clic sul link. Poi si aprirà il tuo account privato.',primary:'Vai all’accesso',secondary:'Torna alla pagina principale',note:'Nessuna e-mail? Controlla la cartella Spam. Poi accedi con e-mail e password.'},
    pl:{title:'Potwierdź swój e-mail.',text:'Otwórz wiadomość potwierdzającą od DUONERA i kliknij link. Potem otworzy się Twoje prywatne konto.',primary:'Przejdź do logowania',secondary:'Wróć na stronę główną',note:'Brak wiadomości? Sprawdź Spam. Potem zaloguj się e-mailem i hasłem.'},
    sk:{title:'Potvrďte svoj e-mail.',text:'Otvorte potvrdzovací e-mail od DUONERA a kliknite na odkaz. Potom sa otvorí váš súkromný účet.',primary:'Otvoriť prihlásenie',secondary:'Späť na hlavnú stránku',note:'E-mail neprišiel? Skontrolujte Spam. Potom sa prihláste e-mailom a heslom.'},
    uk:{title:'Підтвердьте свій e-mail.',text:'Відкрийте лист-підтвердження від DUONERA та натисніть посилання. Після цього відкриється ваш приватний кабінет.',primary:'Перейти до входу',secondary:'На головну',note:'Немає листа? Перевірте папку Спам. Потім увійдіть за e-mail і паролем.'},
    ru:{title:'Подтвердите свой e-mail.',text:'Откройте письмо-подтверждение от DUONERA и нажмите ссылку. После этого откроется ваш личный кабинет.',primary:'Перейти ко входу',secondary:'На главную',note:'Нет письма? Проверьте папку Спам. Затем войдите по e-mail и паролю.'}
  };
  const lang=localStorage.getItem('duonera-lang')||'cs';
  const text=copy[lang]||copy.cs;
  document.documentElement.lang=lang==='uk'?'uk':lang;
  document.querySelector('.thank-you-card h1').textContent=text.title;
  document.querySelector('.thank-you-card p').textContent=text.text;
  document.querySelector('.thank-you-button.primary').textContent=text.primary;
  document.querySelector('.thank-you-button.secondary').textContent=text.secondary;
  document.querySelector('.thank-you-note').textContent=text.note;
</script>
</body>
</html>
