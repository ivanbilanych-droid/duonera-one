<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Profil byl odeslán — DUONERA</title>
  <link rel="stylesheet" href="styles.css?v=5">
  <style>
    body.profile-done{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,rgba(215,174,85,.15),transparent 34%),#080807;color:#f7f0df;font-family:Arial,Helvetica,sans-serif}
    .done-card{width:min(780px,100%);border:1px solid rgba(215,174,85,.48);background:linear-gradient(145deg,#1a1711,#090908);padding:64px 52px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.6)}
    .done-logo{font-family:Georgia,serif;font-size:34px;letter-spacing:.12em;color:#e7c46b}.done-sub{font-size:9px;letter-spacing:.26em;color:#b99a53;margin:7px 0 45px}.done-icon{width:76px;height:76px;border:1px solid #d7ae55;border-radius:50%;display:grid;place-items:center;margin:0 auto 26px;color:#efd078;font-size:31px}.done-card h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,64px);font-weight:400;line-height:1.06;margin:0 0 20px}.done-card p{max-width:590px;margin:0 auto 30px;color:#cfc7b9;font-size:17px;line-height:1.65}.done-next{border-top:1px solid rgba(215,174,85,.23);padding-top:24px;margin-top:30px;color:#a69c8c!important;font-size:13px!important}.done-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.done-actions a{min-height:50px;padding:0 26px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}.primary{background:linear-gradient(135deg,#f0d17b,#c4932f);color:#12100c}.secondary{border:1px solid #b98d35;color:#e8c96e}
    @media(max-width:600px){.done-card{padding:48px 23px}.done-card p{font-size:15px}.done-actions{display:grid}.done-actions a{width:100%}}
  </style>
</head>
<body class="profile-done">
  <main class="done-card">
    <div class="done-logo">♛ DUONERA</div>
    <div class="done-sub">PRIVATE DATING CONCIERGE</div>
    <div class="done-icon">✓</div>
    <h1>Váš profil byl uložen.</h1>
    <p>Děkujeme za důvěru. Profil je aktivní a systém ho automaticky zařadí do vhodných soukromých výběrů.</p>
    <div class="done-actions"><a class="primary" href="ucet.html">Otevřít můj účet</a><a class="secondary" href="mailto:info@duonera.cz">Kontaktovat podporu</a></div>
    <p class="done-next">Kontaktní údaje se v profilu nezobrazují. Vzájemnou volbu řeší DUONERA bezpečně a soukromě.</p>
  </main>
  <script>
    const copy={
      cs:{title:'Váš profil byl uložen.',text:'Děkujeme za důvěru. Profil je aktivní a systém ho automaticky zařadí do vhodných soukromých výběrů.',primary:'Otevřít můj účet',secondary:'Kontaktovat podporu',note:'Kontaktní údaje se v profilu nezobrazují. Vzájemnou volbu řeší DUONERA bezpečně a soukromě.'},
      en:{title:'Your profile has been saved.',text:'Thank you. Your profile is active and the system automatically includes it in suitable private selections.',primary:'Open my account',secondary:'Contact support',note:'Contact details are not displayed in profiles. DUONERA handles mutual choices securely and privately.'},
      de:{title:'Ihr Profil wurde gespeichert.',text:'Vielen Dank. Ihr Profil ist aktiv und wird vom System automatisch in passende private Auswahlen aufgenommen.',primary:'Mein Konto öffnen',secondary:'Support kontaktieren',note:'Kontaktdaten werden im Profil nicht angezeigt. Eine gegenseitige Wahl begleitet DUONERA sicher und privat.'},
      uk:{title:'Вашу анкету збережено.',text:'Дякуємо. Анкета активна, і система автоматично додасть її до відповідних приватних добірок.',primary:'Відкрити мій кабінет',secondary:'Написати підтримці',note:'Контактні дані в анкетах не показуються. DUONERA супроводжує взаємний вибір безпечно та приватно.'},
      ru:{title:'Ваша анкета сохранена.',text:'Спасибо. Анкета активна, и система автоматически добавит её в подходящие закрытые подборки.',primary:'Открыть мой кабинет',secondary:'Написать поддержке',note:'Контактные данные в анкетах не показываются. DUONERA сопровождает взаимный выбор безопасно и конфиденциально.'}
    };
    const lang=localStorage.getItem('duonera-lang')||'cs';
    const text=copy[lang]||copy.cs;
    document.documentElement.lang=lang==='uk'?'uk':lang;
    document.querySelector('.done-card h1').textContent=text.title;
    document.querySelector('.done-card p').textContent=text.text;
    document.querySelector('.done-actions .primary').textContent=text.primary;
    document.querySelector('.done-actions .secondary').textContent=text.secondary;
    document.querySelector('.done-next').textContent=text.note;
    localStorage.removeItem('duonera-profile-draft');
    localStorage.removeItem('duonera-short-registration');
    localStorage.removeItem('duonera-lead-id');
  </script>
</body>
</html>
